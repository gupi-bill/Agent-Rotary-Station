<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Agent-Rotary-Station 控制台</title>
  <link rel="stylesheet" href="./styles.css"/>
  <!-- 本地离线依赖：import map 把 esm.sh 地址映射到 webui/lib/，无需外网也能渲染 -->
  <script type="importmap">
  {
    "imports": {
      "https://esm.sh/react@18": "./lib/react.mjs",
      "https://esm.sh/react-dom@18/client": "./lib/react-dom-client.mjs",
      "https://esm.sh/htm@3": "./lib/htm.mjs",
      "https://esm.sh/reactflow@11.10.4?deps=react@18,react-dom@18": "./lib/reactflow.mjs"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18';
    import { createRoot } from 'https://esm.sh/react-dom@18/client';
    import htm from 'https://esm.sh/htm@3';
    import App from './src/App.js';

    const h = htm.bind(React.createElement);
    createRoot(document.getElementById('root')).render(h`<${App} />`);
  </script>
</body>
</html>
